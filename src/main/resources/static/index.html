<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkmate Dungeon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div id="loader">
        <div id="boot-text">
            <p>CM_DOS v1.0 Booting...</p>
            <p>Initializing Memory......... [OK]</p>
            <p>Detecting CPU............. [OK]</p>
            <p>Loading Game Logic........ [OK]</p>
            <p>Establishing AI link...... [OK]</p>
            <p>Rendering CRT Interface... [OK]</p>
            <p>Welcome to Checkmate Dungeon.</p>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <h1>Checkmate Dungeon</h1>
        <div id="game-container">
            <div id="board-container"></div>
            <div id="info-panel">
                <div class="info-box">
                    <h2>STATUS</h2>
                    <p id="status-message">Loading...</p>
                </div>
                <div class="info-box">
                    <h2>CURRENT PLAYER</h2>
                    <p id="current-player"></p>
                </div>
            </div>
        </div>
    </div>
    <audio controls src="vaporwave.mp3" autoplay loop>
        Your browser does not support the audio element.
    </audio>
    <script src="app.js"></script>
</body>
</html>
